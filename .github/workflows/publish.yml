# Publishes to npm with provenance, so anyone installing this can verify the
# tarball was built from this source and not from somebody's laptop.
#
# No NPM_TOKEN. This uses npm's trusted publishing: the package is configured to
# trust this repository and this workflow, and the identity comes from the OIDC
# token GitHub mints for the run. A stored token would be a long-lived
# publishing credential in repository secrets, readable by anyone who can add a
# workflow; this way there is nothing to steal.
name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Two things trusted publishing needs and the defaults do not give.
      #
      # No registry-url on setup-node: it writes an .npmrc containing
      # _authToken=${NODE_AUTH_TOKEN}, and with no token set that becomes a
      # literal placeholder which npm sends instead of using the OIDC
      # identity. The publish then answers 404, which reads like a missing
      # package rather than a refused credential.
      #
      # And a current npm: OIDC publishing landed in 11.5.1, while the npm
      # shipped with Node 22 is older than that.
      - run: npm install -g npm@latest

      - run: npm install

      - run: npm run typecheck

      - run: npm run build

      - run: npm publish --provenance --access public
